<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>520 Rose</title>
    <style>
      :root {
        --ink: #fff7f7;
        --muted: rgba(255, 247, 247, 0.72);
        --rose: #ff3f72;
        --rose-deep: #b61143;
        --leaf: #38b46d;
        --leaf-deep: #14653b;
        --glass: rgba(255, 255, 255, 0.11);
        --line: rgba(255, 255, 255, 0.22);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 50% 35%, rgba(255, 115, 149, 0.34), transparent 30%),
          radial-gradient(circle at 14% 82%, rgba(255, 212, 61, 0.14), transparent 28%),
          linear-gradient(135deg, #22030d 0%, #4d0c1e 42%, #0f1017 100%);
        overflow: hidden;
      }

      body::before {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.045) 0 1px, transparent 1px 82px),
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 82px);
        content: "";
        mask-image: linear-gradient(180deg, transparent, #000 14%, #000 86%, transparent);
      }

      main {
        position: relative;
        z-index: 1;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 28px;
      }

      .card {
        display: grid;
        width: min(920px, 100%);
        min-height: min(680px, calc(100vh - 56px));
        grid-template-columns: minmax(0, 0.92fr) minmax(280px, 1.08fr);
        align-items: center;
        gap: 24px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--glass);
        box-shadow: 0 34px 120px rgba(0, 0, 0, 0.38);
        backdrop-filter: blur(24px) saturate(160%);
        overflow: hidden;
      }

      .copy {
        padding: 44px;
      }

      .kicker {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 850;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(4rem, 11vw, 8rem);
        line-height: 0.9;
        letter-spacing: 0;
      }

      p {
        max-width: 420px;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
      }

      button {
        min-height: 46px;
        margin-top: 30px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 8px;
        color: #2b0710;
        background: linear-gradient(135deg, #ffd6df, #ff6f9c);
        font: inherit;
        font-weight: 850;
        padding: 0 18px;
        cursor: pointer;
        box-shadow: 0 16px 44px rgba(255, 63, 114, 0.26);
      }

      .message {
        min-height: 28px;
        margin-top: 18px;
        color: #ffe5ec;
        font-weight: 760;
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 260ms ease,
          transform 260ms ease;
      }

      .message.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .stage {
        position: relative;
        display: grid;
        min-height: 560px;
        place-items: center;
      }

      .rose {
        position: relative;
        width: 280px;
        height: 420px;
        transform: translateY(20px);
      }

      .stem {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 8px;
        height: 260px;
        border-radius: 999px;
        background: linear-gradient(180deg, var(--leaf), var(--leaf-deep));
        transform: translateX(-50%);
      }

      .leaf {
        position: absolute;
        bottom: 120px;
        width: 86px;
        height: 44px;
        border-radius: 100% 0 100% 0;
        background: linear-gradient(135deg, #60df91, #12663c);
        transform-origin: right center;
      }

      .leaf.left {
        left: 52px;
        transform: rotate(-24deg);
      }

      .leaf.right {
        right: 52px;
        transform: scaleX(-1) rotate(-24deg);
      }

      .bloom {
        position: absolute;
        top: 22px;
        left: 50%;
        width: 220px;
        height: 220px;
        transform: translateX(-50%);
      }

      .petal {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 94px;
        height: 124px;
        border-radius: 70% 70% 58% 58%;
        background: radial-gradient(circle at 40% 24%, #ff9db7, var(--rose) 48%, var(--rose-deep));
        box-shadow: inset -14px -18px 30px rgba(78, 0, 22, 0.24);
        transform-origin: 50% 92%;
      }

      .petal:nth-child(1) {
        transform: translate(-50%, -72%) rotate(0deg);
      }

      .petal:nth-child(2) {
        transform: translate(-86%, -44%) rotate(-58deg);
      }

      .petal:nth-child(3) {
        transform: translate(-14%, -44%) rotate(58deg);
      }

      .petal:nth-child(4) {
        width: 116px;
        height: 142px;
        transform: translate(-96%, -16%) rotate(-112deg);
      }

      .petal:nth-child(5) {
        width: 116px;
        height: 142px;
        transform: translate(-4%, -16%) rotate(112deg);
      }

      .petal:nth-child(6) {
        width: 88px;
        height: 106px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 34%, #ffd1dd, #ff4c80 58%, #9e0d39);
        transform: translate(-50%, -42%);
      }

      .petal-drop {
        position: fixed;
        top: -40px;
        width: 18px;
        height: 26px;
        border-radius: 70% 70% 70% 0;
        background: linear-gradient(135deg, #ff9eb7, #c41249);
        opacity: 0.88;
        transform: rotate(38deg);
        animation: fall var(--duration, 5s) linear forwards;
      }

      @keyframes fall {
        to {
          transform: translate(var(--drift, 40px), 110vh) rotate(320deg);
          opacity: 0;
        }
      }

      @media (max-width: 760px) {
        body {
          overflow-y: auto;
        }

        .card {
          min-height: auto;
          grid-template-columns: 1fr;
        }

        .copy {
          padding: 32px 26px 0;
        }

        .stage {
          min-height: 440px;
        }

        .rose {
          transform: scale(0.8) translateY(24px);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-label="520 rose surprise">
        <div class="copy">
          <p class="kicker">May 20</p>
          <h1>520</h1>
          <p>A small rose hidden away from the main site, just for today.</p>
          <button type="button" data-bloom>Open the rose</button>
          <div class="message" data-message>520 快乐。愿今天有花，也有被认真记得的心意。</div>
        </div>
        <div class="stage" aria-hidden="true">
          <div class="rose">
            <div class="bloom">
              <span class="petal"></span>
              <span class="petal"></span>
              <span class="petal"></span>
              <span class="petal"></span>
              <span class="petal"></span>
              <span class="petal"></span>
            </div>
            <span class="stem"></span>
            <span class="leaf left"></span>
            <span class="leaf right"></span>
          </div>
        </div>
      </section>
    </main>
    <script>
      const button = document.querySelector("[data-bloom]");
      const message = document.querySelector("[data-message]");

      const dropPetal = () => {
        const petal = document.createElement("span");
        petal.className = "petal-drop";
        petal.style.left = `${Math.random() * 100}vw`;
        petal.style.setProperty("--drift", `${Math.random() * 160 - 80}px`);
        petal.style.setProperty("--duration", `${4 + Math.random() * 3}s`);
        document.body.appendChild(petal);
        window.setTimeout(() => petal.remove(), 7600);
      };

      button.addEventListener("click", () => {
        message.classList.add("is-visible");
        for (let index = 0; index < 28; index += 1) {
          window.setTimeout(dropPetal, index * 70);
        }
      });
    </script>
  </body>
</html>
