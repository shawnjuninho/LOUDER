<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Louder Creative</title>
    <style>
      :root {
        --ink: #05080a;
        --muted: #5d656a;
        --cyan: #00d8ff;
        --paper: #f4f6f7;
        --radius: 8px;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 18% 16%, rgba(0, 216, 255, 0.14), transparent 30%),
          linear-gradient(135deg, #fbfcfd 0%, #edf1f3 54%, #f7f8f9 100%),
          repeating-linear-gradient(90deg, rgba(5, 8, 10, 0.032) 0 1px, transparent 1px 92px),
          repeating-linear-gradient(0deg, rgba(5, 8, 10, 0.026) 0 1px, transparent 1px 92px),
          var(--paper);
      }

      main {
        position: relative;
        width: min(640px, calc(100% - 40px));
        overflow: hidden;
        border-radius: var(--radius);
        padding: clamp(28px, 6vw, 54px);
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 24px 80px rgba(5, 8, 10, 0.12);
        backdrop-filter: blur(22px) saturate(150%);
      }

      main::before {
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
          linear-gradient(120deg, rgba(5, 8, 10, 0.08) 0 14%, transparent 14% 64%, rgba(0, 216, 255, 0.14) 64% 74%, transparent 74%),
          repeating-linear-gradient(90deg, rgba(5, 8, 10, 0.035) 0 1px, transparent 1px 48px);
        content: "";
      }

      .brand {
        display: inline-flex;
        min-height: 38px;
        align-items: center;
        border-radius: 6px;
        color: rgba(7, 17, 19, 0.72);
        font-size: 0.78rem;
        font-weight: 900;
        text-transform: uppercase;
      }

      .eyebrow {
        margin: 54px 0 14px;
        color: rgba(7, 17, 19, 0.58);
        font-size: 0.76rem;
        font-weight: 840;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        max-width: 520px;
        margin: 0;
        font-size: clamp(2.4rem, 7vw, 4.4rem);
        line-height: 0.98;
        letter-spacing: 0;
      }

      p {
        max-width: 520px;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 1.02rem;
        line-height: 1.72;
      }

      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        margin-top: 34px;
        border-radius: var(--radius);
        color: #fff;
        background:
          linear-gradient(135deg, #05080a, #263036),
          linear-gradient(90deg, #f0c34a, var(--cyan));
        box-shadow:
          0 18px 38px rgba(5, 8, 10, 0.22),
          0 0 0 1px rgba(0, 216, 255, 0.18);
        font-weight: 800;
        padding: 0 22px;
        text-decoration: none;
      }

      @media (max-width: 560px) {
        main {
          width: calc(100% - 24px);
        }

        a {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="brand">Louder Creative</span>
      <p class="eyebrow">404</p>
      <h1>This page is not available</h1>
      <p>
        The address may have changed or the page may no longer exist. Return to the homepage to continue exploring
        Louder Creative.
      </p>
      <a href="/">Return home</a>
    </main>
  </body>
</html>
