<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Not Found</title>
    <script>
      (function () {
        var path = window.location.pathname.replace(/\/+$/, "");
        var decodedPath = path;

        try {
          decodedPath = decodeURIComponent(path);
        } catch (error) {
          decodedPath = path;
        }

        if (decodedPath === "/air-air-dumb~" || decodedPath === "/air-air-dumb") {
          window.location.replace("/520/");
        }
      })();
    </script>
    <style>
      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        color: #071113;
        background: #f6f8f4;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
      }

      main {
        width: min(520px, calc(100% - 40px));
      }

      a {
        color: inherit;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>File not found</h1>
      <p>The page you are looking for is not here. <a href="/">Return home</a>.</p>
    </main>
  </body>
</html>
